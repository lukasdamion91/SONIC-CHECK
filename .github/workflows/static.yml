name: Build and deploy SONIC CHECK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate public claims
        run: npm run validate:claims

      - name: Build canonical-domain application
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: https://api.soniccheck.io
          REACT_APP_CLERK_PUBLISHABLE_KEY: ${{ vars.REACT_APP_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm run build
          cp build/index.html build/404.html

      - name: Preserve verified build
        uses: actions/upload-artifact@v4
        with:
          name: sonic-check-pages
          path: frontend/build
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: sonic-check-pages
          path: frontend/build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v5
